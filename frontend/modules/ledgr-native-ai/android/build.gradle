plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ledgrnativeai'
version = '1.0.0'

android {
  namespace "expo.modules.ledgrnativeai"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    ndk {
      abiFilters "arm64-v8a"
    }
  }
}

def needleLib = file("src/main/jniLibsStatic/arm64-v8a/libneedle.a")
if (needleLib.exists()) {
  android {
    defaultConfig {
      externalNativeBuild {
        cmake {
          cppFlags "-std=c++17"
          arguments "-DANDROID_STL=c++_shared"
        }
      }
    }
    externalNativeBuild {
      cmake {
        path "src/main/cpp/CMakeLists.txt"
      }
    }
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Runs the downloaded .task model packs. Published on Google's Maven, not
  // Maven Central. LiteRT-LM, which reads .litertlm, has no Android artifact,
  // so .task is the only container we can load without vendoring a C++ runtime.
  implementation 'com.google.mediapipe:tasks-genai:0.10.35'
}
