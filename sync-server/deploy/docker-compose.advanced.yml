services:
  sync:
    build:
      context: ..
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL_FILE: /run/secrets/database_url
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-300}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-26214400}
      DEVICE_ENROLLMENT_TTL_DAYS: ${DEVICE_ENROLLMENT_TTL_DAYS:-90}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-/backups/status.json}
      TRUST_PROXY: "true"
    secrets: [database_url, metrics_token]
    volumes:
      - backups:/backups:ro
    networks: [private, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [sync]
    networks: [edge]
    security_opt: [no-new-privileges:true]

networks:
  private:
    internal: true
  edge:

volumes:
  backups:
  caddy_data:
  caddy_config:

secrets:
  database_url:
    file: ./secrets/database_url
  metrics_token:
    file: ./secrets/metrics_token
