<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledgr AI - AI UI Mockup</title>
  <style>
    :root {
      --bg: #09090b; /* surface */
      --surface-secondary: #18181b;
      --primary: #FDBA21; /* brandPrimary */
      --text: #ffffff;
      --muted: #a1a1aa;
      --border: #27272a;
      --radius: 12px;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { background-color: #111; color: var(--text); padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .phone {
      width: 375px; height: 812px;
      background-color: var(--bg);
      border-radius: 40px;
      border: 8px solid #222;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 60px 20px 20px 20px;
      border-bottom: 1px solid var(--border);
      background-color: var(--surface-secondary);
    }
    .header-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .back-btn { font-size: 24px; color: var(--text); cursor: pointer; }

    /* SCROLL VIEW */
    .scroll-view { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; }
    .scroll-view::-webkit-scrollbar { display: none; }

    /* WELCOME MSG */
    .welcome { display: flex; flex-direction: column; align-items: center; padding: 32px 16px; gap: 12px; }
    .welcome-text { text-align: center; color: var(--muted); font-size: 14px; line-height: 20px; }

    /* SUGGESTIONS */
    .suggest-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 24px; margin-bottom: 8px; }
    .suggest-chip {
      padding: 16px; border-radius: var(--radius);
      border: 1px solid var(--border);
      background-color: var(--surface-secondary);
      margin-bottom: 8px; font-size: 14px; color: var(--text);
      cursor: pointer; transition: background 0.2s;
    }
    .suggest-chip:hover { background-color: var(--border); }

    /* NEW INPUT BAR */
    .input-bar {
      display: flex; align-items: center;
      padding: 12px 16px; gap: 12px;
      border-top: 1px solid var(--border);
      background-color: var(--surface-secondary);
    }

    .camera-btn {
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; background: transparent; border: none; padding: 4px;
      color: var(--muted); transition: color 0.2s;
    }
    .camera-btn:hover { color: var(--primary); }
    .camera-btn svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    .input-wrapper {
      flex: 1; display: flex; align-items: center;
      border: 1px solid var(--border);
      border-radius: 20px;
      background-color: var(--bg);
      padding: 6px 12px 6px 16px;
    }
    .text-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; padding: 6px 0;
    }
    .text-input::placeholder { color: var(--muted); }

    .mic-btn {
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; background: transparent; border: none; padding: 4px;
      color: var(--muted); transition: color 0.2s;
    }
    .mic-btn:hover { color: var(--primary); }
    .mic-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    
    .send-btn {
      width: 32px; height: 32px; border-radius: 16px;
      background-color: var(--primary);
      display: flex; justify-content: center; align-items: center;
      font-size: 16px; color: #000; cursor: pointer; display: none;
      margin-left: 4px; border: none;
    }
    .send-btn svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  </style>
</head>
<body>

  <div class="phone">
    
    <div class="header-bar">
      <div class="back-btn">‹</div>
      <div class="header-title">Ask about your books</div>
      <div style="width: 24px;"></div>
    </div>

    <div class="scroll-view">
      <div class="welcome">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
        </svg>
        <div class="welcome-text">Ask me anything about your finances. I'll answer using your actual data.</div>
      </div>

      <div class="suggest-label">Try asking</div>
      
      <div class="suggest-chip">What was my profit this month?</div>
      <div class="suggest-chip">How do I create an invoice?</div>
      <div class="suggest-chip">Record a 500 expense for fuel</div>
      <div class="suggest-chip">Who owes me the most money?</div>
    </div>

    <!-- MOCKED UPDATED INPUT BAR -->
    <div class="input-bar">
      
      <!-- SIMPLE CAMERA ICON (SVG OUTLINE) -->
      <button class="camera-btn" onclick="alert('Opens camera for receipt scan')">
        <svg viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </button>
      
      <div class="input-wrapper">
        <input type="text" class="text-input" placeholder="Message Ledgr AI..." oninput="toggleSend(this.value)">
        
        <!-- SIMPLE MIC ICON (SVG OUTLINE) -->
        <button class="mic-btn" id="micBtn" onclick="alert('Starts voice recording')">
          <svg viewBox="0 0 24 24">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <button class="send-btn" id="sendBtn" onclick="alert('Sends message')">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      
    </div>

  </div>

  <script>
    function toggleSend(val) {
      const mic = document.getElementById('micBtn');
      const send = document.getElementById('sendBtn');
      if (val.trim().length > 0) {
        mic.style.display = 'none';
        send.style.display = 'flex';
      } else {
        mic.style.display = 'flex';
        send.style.display = 'none';
      }
    }
  </script>
</body>
</html>
