name: Android native validation

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/modules/ledgr-native-ai/**'
      - 'frontend/plugins/withAndroidAssistant.js'
      - 'frontend/app.json'
      - '.github/workflows/android-native-validation.yml'
  pull_request:
    paths:
      - 'frontend/modules/ledgr-native-ai/**'
      - 'frontend/plugins/withAndroidAssistant.js'
      - 'frontend/app.json'
      - '.github/workflows/android-native-validation.yml'
  workflow_dispatch:

concurrency:
  group: android-native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile native AI and link Android resources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

