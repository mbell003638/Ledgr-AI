name: Build Ledgr AI Android

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional Git ref to build instead of the workflow branch (read-only source checkout)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: type-check + unit tests must pass before we spend ~20 min on a build.
  # Mirrors the standalone Tests workflow so a manually-dispatched build is also
  # verified. The build job below declares `needs: test`.
  # ---------------------------------------------------------------------------
  test:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint:ci

      - name: Expo dependency and config validation
        run: npx expo-doctor

      - name: Production dependency audit
        run: npm run audit:ci

      - name: Run unit tests
        run: npx jest --ci

  build:
    name: Build Release APK & AAB
    needs: test
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Fetch Needle on-device engine
        working-directory: frontend
        run: |
          python -m pip install --user cactus-needle
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          node ./scripts/on-device-ai/fetch-native.mjs

      - name: Expo prebuild (generate android project)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      # -----------------------------------------------------------------------
      # Detect whether a persistent release keystore is configured via secrets.
      # Step-level `if:` cannot read `secrets.*` directly, so we probe here and
      # expose a boolean output that later steps gate on. We only ever test for
      # presence ("" vs non-empty) — the secret value is never printed.
      # -----------------------------------------------------------------------
      - name: Check for release keystore secret
        id: check
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] \
            && [ -n "$RELEASE_KEY_ALIAS" ] \
            && [ -n "$RELEASE_STORE_PASSWORD" ] \
            && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=" >> "$GITHUB_OUTPUT"
            echo "Release keystore secrets detected — build will be Play-Store signed."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=-testsigned" >> "$GITHUB_OUTPUT"
            echo "No release keystore secrets — build will be TEST-signed."
          fi

      # -----------------------------------------------------------------------
      # Real signing path: decode the base64 keystore from the secret and write
      # the gradle signing properties. All secret values arrive via `env:` and
      # are consumed by the shell / ci-sign.py — none are echoed.
      # -----------------------------------------------------------------------
      - name: Decode release keystore (persistent signing)
        if: steps.check.outputs.has_keystore == 'true'
        working-directory: frontend/android/app
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > ledgr-release.keystore
          echo "Decoded release keystore ($(wc -c < ledgr-release.keystore) bytes)."

      - name: Configure persistent release signing
        if: steps.check.outputs.has_keystore == 'true'
        working-directory: frontend/android
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            echo "MYAPP_RELEASE_STORE_FILE=ledgr-release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "MYAPP_RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "MYAPP_RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> gradle.properties
          python3 ../scripts/ci-sign.py

      # -----------------------------------------------------------------------
      # Fallback signing path: no secret configured. Generate a throwaway
      # keystore so test builds still produce an installable APK/AAB, but make
      # it loud that these outputs must NOT go to the Play Store.
      # -----------------------------------------------------------------------
      - name: ⚠ TEST-SIGNED BUILD WARNING
        if: steps.check.outputs.has_keystore == 'false'
        run: |
          echo "::warning title=Test-signed build::⚠ TEST-SIGNED BUILD — NOT for Play Store. Configure RELEASE_KEYSTORE_B64 (plus RELEASE_KEY_ALIAS, RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD) as GitHub secrets to produce a Play-Store-signable build. Artifacts from this run are suffixed '-testsigned'."
          {
            echo "## ⚠ TEST-SIGNED BUILD — NOT for Play Store"
            echo ""
            echo "This build was signed with a **throwaway keystore generated in CI**."
            echo "Google Play requires every update to be signed with the **same** key forever."
            echo ""
            echo "To produce a publishable build, add these repository secrets:"
            echo "- \`RELEASE_KEYSTORE_B64\` — base64 of your persistent \`.keystore\`"
            echo "- \`RELEASE_KEY_ALIAS\`"
            echo "- \`RELEASE_STORE_PASSWORD\`"
            echo "- \`RELEASE_KEY_PASSWORD\`"
            echo ""
            echo "Artifacts from this run are suffixed \`-testsigned\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate throwaway keystore (test signing)
        if: steps.check.outputs.has_keystore == 'false'
        working-directory: frontend/android/app
        run: |
          keytool -genkeypair -v -keystore ledgr-release.keystore \
            -alias ledgr -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ledgr123 -keypass ledgr123 \
            -dname "CN=Ledgr, OU=Mobile, O=Ledgr, L=City, ST=State, C=US"

      - name: Configure throwaway release signing
        if: steps.check.outputs.has_keystore == 'false'
        working-directory: frontend/android
        run: |
          {
            echo "MYAPP_RELEASE_STORE_FILE=ledgr-release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=ledgr"
            echo "MYAPP_RELEASE_STORE_PASSWORD=ledgr123"
            echo "MYAPP_RELEASE_KEY_PASSWORD=ledgr123"
          } >> gradle.properties
          python3 ../scripts/ci-sign.py

      - name: Build Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB (Play Store)
        if: steps.check.outputs.has_keystore == 'true'
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon

      - name: List outputs
        run: |
          find frontend/android -name "*.apk" -type f
          find frontend/android -name "*.aab" -type f

      # Actions artifact storage is quota-limited. Publish the latest CI output to
      # one private, prerelease tag instead, replacing the previous APK/AAB assets.
      # Test-signed outputs are named explicitly and must never be submitted to Play.
      - name: Publish latest Android CI outputs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.source_ref != '' && 'android-ci-codex-sol' || 'android-ci' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ledgr-android-ci
          source_sha="$(git rev-parse HEAD)"
          apk="$(find frontend/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          if [ "${{ steps.check.outputs.has_keystore }}" = "true" ]; then
            cp "$apk" /tmp/ledgr-android-ci/Ledgr-AI-APK.apk
            aab="$(find frontend/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
            if [ -z "$aab" ]; then
              echo "No release AAB was produced despite persistent signing being configured" >&2
              exit 1
            fi
            cp "$aab" /tmp/ledgr-android-ci/Ledgr-AI-AAB.aab
            title="Android CI build $GITHUB_RUN_NUMBER (Play-Store-signable path)"
            notes="Latest Android CI output from source commit $source_sha. The APK/AAB is built with the configured persistent release keystore. Verify the signing identity and test on physical devices before Play submission."
          else
            cp "$apk" /tmp/ledgr-android-ci/Ledgr-AI-APK-testsigned.apk
            title="Android CI build $GITHUB_RUN_NUMBER (TEST-SIGNED)"
            notes="Latest Android CI output from source commit $source_sha. This APK uses a throwaway test keystore and must not be submitted to Google Play. Configure the persistent release-keystore secrets for a publishable AAB."
          fi
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --target "$source_sha" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" /tmp/ledgr-android-ci/* --clobber
          apk_asset="$(find /tmp/ledgr-android-ci -maxdepth 1 -type f -name '*.apk' -printf '%f\\n' | head -n 1)"
          apk_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_asset}"
          {
            echo "## Android build download"
            echo ""
            echo "[Download the APK](${apk_url})"
            echo ""
            echo "Release page: https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
            if [ "${{ steps.check.outputs.has_keystore }}" != "true" ]; then
              echo ""
              echo "> This is a TEST-SIGNED APK. It is for device testing only and must not be submitted to Google Play."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
