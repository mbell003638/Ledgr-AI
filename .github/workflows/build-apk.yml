name: Build Ledgr AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/graalvm /opt/ghc /usr/local/share/powershell /usr/local/lib/android/sdk/ndk/26* || true
          sudo apt-get clean || true
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: |
          cd frontend
          yarn install --frozen-lockfile || yarn install

      - name: Prebuild Android project
        run: |
          cd frontend
          npx expo prebuild --platform android --no-install

      - name: Build Android Debug APK (arm64 only)
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Find APK files
        run: find frontend/android -name "*.apk" -type f

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledgr-AI-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
