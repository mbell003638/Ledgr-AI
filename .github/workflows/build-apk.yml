name: Build Ledgr AI Android

on:
  workflow_dispatch:
  push:
    branches: [ settings-ui-optimized, main ]


jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Expo prebuild (generate android project)
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Generate signing keystore
        working-directory: frontend/android/app
        run: |
          keytool -genkeypair -v -keystore ledgr-release.keystore \
            -alias ledgr -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ledgr123 -keypass ledgr123 \
            -dname "CN=Ledgr, OU=Mobile, O=Ledgr, L=City, ST=State, C=US"

      - name: Configure release signing
        working-directory: frontend/android
        run: |
          {
            echo "MYAPP_RELEASE_STORE_FILE=ledgr-release.keystore"
            echo "MYAPP_RELEASE_KEY_ALIAS=ledgr"
            echo "MYAPP_RELEASE_STORE_PASSWORD=ledgr123"
            echo "MYAPP_RELEASE_KEY_PASSWORD=ledgr123"
          } >> gradle.properties
          python3 ../scripts/ci-sign.py

      - name: Build Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Build Release AAB (Play Store)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: List outputs
        run: |
          find frontend/android -name "*.apk" -type f
          find frontend/android -name "*.aab" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ledgr-AI-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ledgr-AI-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
