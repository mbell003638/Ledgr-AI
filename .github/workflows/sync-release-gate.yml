name: Sync release gate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: sync-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend sync and release checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint:ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Dependency audit
        run: npm run audit:ci

      - name: Frontend tests
        run: npm test -- --ci --runInBand

  sync-server:
    name: Sync server build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: Shell and migration checks
        run: |
          bash -n deploy/backup.sh deploy/restore-drill.sh
          grep -q 'CREATE TABLE IF NOT EXISTS sync_events' migrations/001_sync.sql
          grep -q 'aggregate_revision' migrations/001_sync.sql
          grep -q 'sync_devices' migrations/001_sync.sql

  deployment:
    name: Deployment configuration and image gate
    runs-on: ubuntu-latest
    needs: [frontend, sync-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create CI-only Compose secret files
        run: |
          mkdir -p sync-server/deploy/secrets
          printf 'ci-postgres-password\n' > sync-server/deploy/secrets/postgres_password
          printf 'postgresql://ledgr_sync:ci-postgres-password@postgres:5432/ledgr_sync\n' > sync-server/deploy/secrets/database_url
          printf 'ci-metrics-token\n' > sync-server/deploy/secrets/metrics_token

      - name: Validate Compose configuration
        env:
          OIDC_ISSUER: https://identity.example.test/realms/ledgr
          OIDC_AUDIENCE: ledgr-mobile
          OIDC_JWKS_URL: https://identity.example.test/realms/ledgr/protocol/openid-connect/certs
          CORS_ORIGIN: https://app.example.test
          SYNC_DOMAIN: sync.example.test
        run: docker compose -f sync-server/deploy/docker-compose.yml config -q

      - name: Build sync-server image
        run: docker build --tag ledgr-sync-server:ci sync-server

      - name: Remove CI-only secrets
        if: always()
        run: rm -f sync-server/deploy/secrets/postgres_password sync-server/deploy/secrets/database_url sync-server/deploy/secrets/metrics_token
