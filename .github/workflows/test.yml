name: Tests

on:
  push:
    branches: [ main, master, feature/html-parity, phase2-sqlite-storage ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run unit tests (accounting engine)
        run: npm test
