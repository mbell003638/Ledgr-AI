name: Publish self-host distribution

on:
  push:
    tags: ['self-host-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/ledgr-sync
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: sync-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/self-host-v')
    needs: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package distribution bundle
        run: |
          mkdir -p release/ledgr-self-host
          cp -R sync-server/distribution/. release/ledgr-self-host/
          cp sync-server/deploy/backup.sh sync-server/deploy/restore-drill.sh release/ledgr-self-host/
          chmod +x release/ledgr-self-host/install.sh
          tar -czf ledgr-self-host-${GITHUB_REF_NAME}.tar.gz -C release ledgr-self-host
          sha256sum ledgr-self-host-${GITHUB_REF_NAME}.tar.gz > ledgr-self-host-${GITHUB_REF_NAME}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ledgr-self-host-bundle
          path: |
            ledgr-self-host-${GITHUB_REF_NAME}.tar.gz
            ledgr-self-host-${GITHUB_REF_NAME}.sha256
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Ledgr self-host $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ledgr-self-host-${GITHUB_REF_NAME}.tar.gz ledgr-self-host-${GITHUB_REF_NAME}.sha256
